<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#0d0e15" rx="100"/>
  <defs>
    <linearGradient id="gradAlfarez" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="gradMart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <linearGradient id="gradLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>
  
  <!-- Typography "Alfarez" -->
  <text x="75" y="240" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="64" fill="url(#gradAlfarez)" letter-spacing="-1">Alfarez</text>

  <!-- Typography "Mart" -->
  <text x="315" y="240" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-style="italic" font-size="64" fill="url(#gradMart)" letter-spacing="-1">Mart</text>

  <!-- Sleek Loading Bar Line Indicator -->
  <rect x="75" y="280" width="362" height="8" rx="4" fill="#1e293b"/>
  <rect x="75" y="280" width="200" height="8" rx="4" fill="url(#gradLine)"/>
  <circle cx="275" cy="284" r="6" fill="#ef4444"/>

  <!-- Subtitle -->
  <text x="256" y="325" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" font-size="20" fill="#64748b" text-anchor="middle" letter-spacing="1">MEMUAT APLIKASI...</text>
</svg>
